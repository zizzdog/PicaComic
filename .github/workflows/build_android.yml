name: Build Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Signing Keystore & key.properties
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks
          echo "${{ secrets.KEY_PROPERTIES }}" > android/key.properties

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Arm64-v8a Only)
        run: flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PicaComic-Arm64-APK
          path: build/app/outputs/flutter-apk/*.apk
